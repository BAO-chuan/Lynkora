<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lynkora — Dashboard</title><link rel="stylesheet" href="styles.css?v=1"></head>
<body><header class="topbar"><a class="brand" href="index.html"><span class="logo">↗</span>Lynkora</a><div class="auth-actions"><span id="userEmail" class="muted"></span><button class="ghost" id="logoutBtn">Đăng xuất</button></div></header>
<main class="dash"><aside><b>Publisher</b><a class="active" href="dashboard.html">Tổng quan</a><a href="#create">Tạo link</a><a href="#links">Link của tôi</a></aside>
<section class="dash-main"><div class="dash-title"><div><span class="eyebrow">DASHBOARD</span><h1>Quản lý link</h1></div></div>
<div class="stats"><article><small>Tổng link</small><b id="totalLinks">0</b></article><article><small>Tổng lượt mở</small><b id="totalClicks">0</b></article><article><small>Lượt hợp lệ</small><b id="validClicks">0</b></article></div>
<div class="panel" id="create"><h2>Tạo link mới</h2><form id="shortenForm" class="shorten"><input id="targetUrl" type="url" required placeholder="https://example.com/..."><button class="primary" type="submit">Rút gọn</button></form><div id="createMsg" class="msg"></div></div>
<div class="panel" id="links"><div class="row-between"><h2>Link của tôi</h2><button id="refreshBtn" class="ghost">Làm mới</button></div><div id="linksList" class="link-list"><p class="muted">Đang tải...</p></div></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=2"></script><script src="app.js?v=1"></script></body></html>
